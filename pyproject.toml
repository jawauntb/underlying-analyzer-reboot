[project]
name = "underlying-analyzer-reboot"
version = "0.1.0"
description = "Rebooted market chart and analysis app for The Underlying."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "Flask>=3.0,<4",
  "flask-cors>=5.0,<6",
  "gunicorn>=22.0,<24",
  "matplotlib>=3.9,<4",
  "mcp>=1.27,<2",
  "numpy>=2.0,<3",
  "pandas>=2.2,<3",
  "reportlab>=4.2,<5",
  "requests>=2.32,<3",
  "yfinance>=1.4.1,<2",
]

[project.optional-dependencies]
dev = [
  "mypy>=1.16,<2",
  "python-dotenv>=1.0,<2",
  "pytest>=8.3,<9",
  "ruff>=0.11,<1",
  "types-requests>=2.32,<3",
]
deploy = [
  "modal>=1.4,<2",
]
mcp = [
  "mcp>=1.27,<2",
]

[project.scripts]
underlying-mcp = "mcp_server.server:main"

[tool.setuptools]
packages = ["app", "mcp_server"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "C4", "SIM", "UP", "ARG"]

[tool.mypy]
python_version = "3.12"
warn_unused_configs = true
ignore_missing_imports = true
check_untyped_defs = true
disallow_untyped_defs = true
exclude = ["\\.venv"]

[tool.pytest.ini_options]
testpaths = ["tests"]
