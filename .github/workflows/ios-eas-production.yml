# TestFlight: EAS production iOS build + App Store Connect auto-submit.
#
# Triggers
# - Green `Mobile cloud proof` on `main`
# - Manual: Actions → ios-eas-production → Run workflow
# - Version tags: `v*`
#
# Do not set EAS_NO_VCS=1. The worker git root must contain mobile/package.json.
name: ios-eas-production

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"
  workflow_run:
    workflows: ["Mobile cloud proof"]
    types: [completed]
    branches: [main]

concurrency:
  group: ios-eas-production-store
  cancel-in-progress: false

jobs:
  eas-ios:
    name: eas build + auto-submit (ios production)
    runs-on: ubuntu-latest
    if: >-
      github.event_name != 'workflow_run' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'main')
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Require EXPO_TOKEN
        run: |
          if [ -z "${{ secrets.EXPO_TOKEN }}" ]; then
            echo "::error::EXPO_TOKEN repo secret is not set"
            exit 1
          fi

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.16.0"
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Install mobile dependencies
        working-directory: mobile
        run: npm ci --no-audit --fund=false

      - name: Setup EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: EAS build + submit
        working-directory: mobile
        run: >
          eas build
          --platform ios
          --profile production
          --auto-submit
          --non-interactive
